services:
  - type: web
    name: libbaas-pk-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: libbaas-pk-db
          property: connectionString

  - type: static
    name: libbaas-pk-frontend
    env: static
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://libbaas-pk-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: libbaas-pk-db
    databaseName: libbaas_pk
    user: libbaas_pk
    plan: starter